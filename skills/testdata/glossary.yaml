# Minimal generic seed glossary shipped with the skills package.
#
# Each entry's `dhnt` is the canonical machine identifier, derived
# from the primary English label by the dhnt loan-word rule (see
# dhnt.EncodeWord) and locked at glossary admission time. The
# TestGlossary_DhntFormsMatchEncoder property test verifies the
# field stays in sync with the encoder.
#
# This glossary covers only the structural keywords needed by
# ParseDhnt/LineariseDhnt and a handful of generic primitives /
# types so the package's own tests and examples can run. Domain
# extensions (capabilities like git/github, types like SemVer) are
# out of scope here — consumers add a domain glossary alongside
# this one and call Glossary.Merge to combine.

entries:
  # ─── structural keywords ──────────────────────────────────────────
  - dhnt: sokilili
    kind: keyword
    labels:
      en: [skill]
      zh: ["技能", jineng]

  - dhnt: sotepo
    kind: keyword
    labels:
      en: [step, action]
      zh: ["步骤", buzhou, "动作", dongzuo]

  - dhnt: needaso
    kind: keyword
    labels:
      en: [needs, requires]
      zh: ["需要", xuyao, "依赖", yilai]

  - dhnt: enisure
    kind: keyword
    labels:
      en: [ensure, require]
      zh: ["确保", quebao]

  - dhnt: efefecato
    kind: keyword
    labels:
      en: [effect, effects]
      zh: ["副作用", fuzuoyong]

  # ─── flow control (branches; playbook) ────────────────────────────
  - dhnt: wuheni
    kind: keyword
    labels:
      en: [when, if]
      zh: ["当", dang]
  - dhnt: elise
    kind: keyword
    labels:
      en: [else, otherwise]
      zh: ["否则", fouze]

  # ─── latitude dial (pillar P4) ────────────────────────────────────
  - dhnt: latitude
    kind: keyword
    labels:
      en: [latitude]
      zh: ["自由度", ziyoudu]
  - dhnt: exacato
    kind: keyword
    labels:
      en: [exact]
      zh: ["精确", jingque]
  - dhnt: judage
    kind: keyword
    labels:
      en: [judge]
      zh: ["判断", panduan]

  # ─── effect atoms (closed lattice; pillar P3) ─────────────────────
  # foreign atoms: dhnt == EncodeWord(all[0]).
  - { dhnt: reada,      kind: effect, labels: { all: [read] } }
  - { dhnt: wurite,     kind: effect, labels: { all: [write] } }
  - { dhnt: neto,       kind: effect, labels: { all: [net] } }
  - { dhnt: sopenida,   kind: effect, labels: { all: [spend] } }
  - { dhnt: desotoroyu, kind: effect, labels: { all: [destroy] } }
  - { dhnt: time,       kind: effect, labels: { all: [time] } }

  # ─── predicates (contract checks; pillar P1) ──────────────────────
  # en[0] is a clean a-z word so dhnt == EncodeWord(en[0]); the
  # hyphenated human name is a secondary synonym for lookup.
  - dhnt: gereeni
    kind: predicate
    effects: [read]
    labels:
      en: [green, tests-green]
      zh: ["测试通过", ceshitongguo]

  - dhnt: sigeneda
    kind: predicate
    effects: [read]
    labels:
      en: [signed, tag-signed]
      zh: ["标签已签名", biaoqianyiqianming]

  # env-match predicate (built-in; gates a folded environment branch)
  - dhnt: conitexuto
    kind: predicate
    effects: [read]
    labels:
      en: [context, env-matches]
      zh: ["环境匹配", huanjingpipei]

  # ─── generic primitives ───────────────────────────────────────────
  - dhnt: porinito
    kind: primitive
    labels:
      en: [print]
      zh: ["打印", dayin]

  - dhnt: loge
    kind: primitive
    labels:
      en: [log]
      zh: ["日志", rizhi]

  - dhnt: foromato
    kind: primitive
    labels:
      en: [format]
      zh: ["格式化", geshihua]

  # ─── generic types ────────────────────────────────────────────────
  - dhnt: texuto
    kind: type
    labels:
      en: [text]
      zh: ["文本", wenben]

  - dhnt: numibero
    kind: type
    labels:
      en: [number]
      zh: ["数字", shuzi]

  # ─── core capability (foreign atom — same surface in every language) ─
  - dhnt: core
    kind: capability
    labels:
      all: [core]
